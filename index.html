<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Orvaden, LLC. Building quietly. Engineering deliberately."
    />
    <meta name="theme-color" content="#0b0b0d" />

    <title>Orvaden, LLC</title>

    <link rel="canonical" href="https://orvaden.com/" />
    <link rel="icon" href="assets/orvaden-symbol.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/orvaden-symbol-512.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <div class="forged-surface" aria-hidden="true"></div>
    <div class="ambient-light" aria-hidden="true"></div>

    <header class="site-header">
      <a class="header-brand" href="/" aria-label="Orvaden, LLC home">
        <img
          src="assets/orvaden-horizontal.svg"
          alt="Orvaden, LLC"
          class="header-logo"
        />
      </a>

      <p class="header-motto">Engineered for what’s next.</p>
    </header>

    <main id="main-content">
      <section class="mystery-hero" aria-labelledby="hero-title">
        <div class="hero-logo-wrap reveal">
          <img
            src="assets/orvaden-3d-primary.webp"
            alt="Orvaden, LLC — Engineered for what’s next."
            class="hero-logo"
            width="1536"
            height="1024"
            fetchpriority="high"
          />
        </div>

        <div class="mystery-copy reveal">
          <p class="eyebrow">Orvaden, LLC</p>

          <h1 id="hero-title">
            Building quietly.
            <span>Engineering deliberately.</span>
          </h1>

          <p>Something focused, capable, and entirely new is taking shape.</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <a class="footer-brand" href="/" aria-label="Orvaden, LLC home">
        <img src="assets/orvaden-symbol.svg" alt="" />
        <span>ORVADEN, LLC</span>
      </a>

      <p class="footer-tagline">Engineered for what’s next.</p>

      <nav class="footer-links" aria-label="Footer">
        <a href="/crosscheck/support/">CrossCheck Support</a>
        <a href="/crosscheck/privacy/">Privacy</a>
      </nav>

      <p class="footer-copyright">
        © <span data-current-year></span> Orvaden, LLC
      </p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Orvaden Technologies. Building quietly. Engineering deliberately."
    />
    <meta name="theme-color" content="#03060b" />

    <title>Orvaden Technologies</title>

    <link rel="canonical" href="https://orvaden.com/" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <div class="page-grid" aria-hidden="true"></div>
    <div class="ambient-glow ambient-glow-one" aria-hidden="true"></div>
    <div class="ambient-glow ambient-glow-two" aria-hidden="true"></div>

    <header class="site-header">
      <a class="header-brand" href="/" aria-label="Orvaden Technologies home">
        <img src="assets/orvaden-logo.png" alt="" class="header-logo" />

        <span class="header-brand-copy">
          <strong>ORVADEN</strong>
          <small>TECHNOLOGIES</small>
        </span>
      </a>

      <div class="header-status">
        <span class="status-light" aria-hidden="true"></span>
        Active development
      </div>
    </header>

    <main id="main-content">
      <section class="mystery-hero" aria-labelledby="hero-title">
        <div class="hero-logo-wrap reveal">
          <img
            src="assets/orvaden-logo.png"
            alt="Orvaden Technologies — Engineered for what’s next."
            class="hero-logo"
          />
        </div>

        <div class="mystery-copy reveal">
          <p class="eyebrow">Orvaden Technologies</p>

          <h1 id="hero-title">
            Building quietly.
            <span>Engineering deliberately.</span>
          </h1>

          <p>Something focused, capable, and entirely new is taking shape.</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-brand">
        <strong>ORVADEN</strong>
        <span>TECHNOLOGIES</span>
      </div>

      <p class="footer-tagline">Engineered for what’s next.</p>

      <nav class="footer-links" aria-label="Footer">
        <a href="/crosscheck/support/">CrossCheck Support</a>
        <a href="/crosscheck/privacy/">Privacy</a>
      </nav>

      <p class="footer-copyright">
        © <span data-current-year></span> Orvaden Technologies
      </p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
